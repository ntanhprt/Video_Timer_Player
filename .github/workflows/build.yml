name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['web/**', 'docs/**', 'README.md']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until project exists
        id: chk
        run: |
          if [ -f pubspec.yaml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "No pubspec.yaml yet, skipping"; fi
      - uses: actions/setup-java@v5
        if: steps.chk.outputs.ok == 'true'
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        if: steps.chk.outputs.ok == 'true'
        with: { channel: stable, cache: true }
      - name: Restore signing key
        if: steps.chk.outputs.ok == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
          fi
      - if: steps.chk.outputs.ok == 'true'
        run: flutter pub get
      - if: steps.chk.outputs.ok == 'true'
        run: flutter analyze
      - if: steps.chk.outputs.ok == 'true'
        run: flutter test
        env:
          # A zone with daylight saving, so the DST test in schedule_test.dart is meaningful.
          TZ: America/New_York
      - if: steps.chk.outputs.ok == 'true'
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
