name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['web/**', 'docs/**', 'README.md']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until project exists
        id: chk
        run: |
          if [ -f pubspec.yaml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "No pubspec.yaml yet, skipping"; fi
      - uses: actions/setup-java@v5
        if: steps.chk.outputs.ok == 'true'
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        if: steps.chk.outputs.ok == 'true'
        with: { channel: stable, cache: true }
      - name: Restore signing key
        if: steps.chk.outputs.ok == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
          fi
      - if: steps.chk.outputs.ok == 'true'
        run: flutter pub get
      - if: steps.chk.outputs.ok == 'true'
        run: flutter analyze
      - if: steps.chk.outputs.ok == 'true'
        run: flutter test
        env:
          # A zone with daylight saving, so the DST test in schedule_test.dart is meaningful.
          TZ: America/New_York
      - name: sherpa-onnx library and Vietnamese speech model (offline voice commands; not stored in git)
        if: steps.chk.outputs.ok == 'true'
        run: |
          mkdir -p android/app/libs android/app/src/main/assets/model-vi
          curl -sSfL -o android/app/libs/sherpa-onnx-2.0.1.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          curl -sSfL -o "$RUNNER_TEMP/vi.tar.bz2" https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-vi-int8-2025-04-20.tar.bz2
          tar -xjf "$RUNNER_TEMP/vi.tar.bz2" -C "$RUNNER_TEMP"
          m="$RUNNER_TEMP/sherpa-onnx-zipformer-vi-int8-2025-04-20"
          cp "$m"/encoder-*.int8.onnx android/app/src/main/assets/model-vi/encoder.onnx
          cp "$m"/decoder-*.onnx android/app/src/main/assets/model-vi/decoder.onnx
          cp "$m"/joiner-*.int8.onnx android/app/src/main/assets/model-vi/joiner.onnx
          cp "$m"/tokens.txt android/app/src/main/assets/model-vi/tokens.txt
      - if: steps.chk.outputs.ok == 'true'
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
