name: Bootstrap Flutter project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create Android project (only if missing)
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --platforms=android --org vn.aisolutions --project-name video_timer_player .
          fi
      - name: Commit generated project
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: flutter create (bootstrap)"
          git push
